<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semoga Berhenti</title>
  <style>
    :root {
      --bg-main: #070d16;
      --bg-card: #0e1827;
      --bg-card-soft: #132136;
      --border: rgba(56, 189, 248, 0.16);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-teal: #14b8a6;
      --accent-glow: rgba(20, 184, 166, 0.25);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.14);
      --success: #2dd4bf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(20, 184, 166, 0.14), transparent 40%),
        radial-gradient(circle at 85% 0%, rgba(56, 189, 248, 0.14), transparent 45%),
        var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding: 20px 14px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      text-align: center;
      padding: 10px 0 4px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--accent-teal);
      background: rgba(20, 184, 166, 0.1);
      border: 1px solid rgba(20, 184, 166, 0.28);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-teal);
      box-shadow: 0 0 10px var(--accent-teal);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(1.85rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 15%, var(--accent-blue) 60%, var(--accent-teal) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-info {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .card {
      background: linear-gradient(180deg, rgba(19, 33, 54, 0.72), rgba(14, 24, 39, 0.92));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Timer Real-Time */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .time-box {
      background: var(--bg-main);
      border: 1px solid rgba(56, 189, 248, 0.14);
      border-radius: 14px;
      padding: 16px 8px;
      text-align: center;
    }

    .time-value {
      font-size: clamp(1.5rem, 5.5vw, 2.45rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      line-height: 1.1;
    }

    .time-label {
      margin-top: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Status Otomatis */
    .status-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.11), rgba(20, 184, 166, 0.11));
      border-left: 4px solid var(--accent-teal);
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Statistik Rekor & Progress */
    .record-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .record-text {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .target-text {
      font-size: 0.86rem;
      color: var(--accent-teal);
      font-weight: 600;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--bg-main);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-teal));
      box-shadow: 0 0 18px var(--accent-glow);
      transition: width 0.4s ease;
    }

    /* Tombol Darurat */
    .emergency-btn {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.45), rgba(15, 118, 110, 0.45));
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 24px
